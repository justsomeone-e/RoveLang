<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rove WASM Interactive Engine</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --primary: #38bdf8;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #a855f7;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 520px;
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .badge {
            font-size: 0.75rem;
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .status {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 1.25rem;
        }
        .form-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .input-col {
            flex: 1;
        }
        label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 0.25rem;
        }
        input[type="number"] {
            width: 100%;
            box-sizing: border-box;
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.6rem 0.8rem;
            color: var(--text);
            font-size: 1rem;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }
        button {
            background: #273549;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.6rem;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        button:hover {
            background: var(--primary);
            color: #0f172a;
            font-weight: 600;
        }
        .result-box {
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .result-label {
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .result-val {
            font-size: 1.75rem;
            font-weight: bold;
            color: var(--primary);
            margin-top: 0.25rem;
        }
        .history {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--muted);
            max-height: 120px;
            overflow-y: auto;
            border-top: 1px solid var(--border);
            padding-top: 0.75rem;
        }
        .history-item {
            padding: 2px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rove WebAssembly Engine <span class="badge">WASM v1</span></h1>
        <div id="status" class="status">Loading Rove WASM Core...</div>

        <div class="form-group">
            <div class="input-col">
                <label for="numA">Operand A</label>
                <input type="number" id="numA" value="12">
            </div>
            <div class="input-col">
                <label for="numB">Operand B</label>
                <input type="number" id="numB" value="5">
            </div>
        </div>

        <div class="button-grid">
            <button id="btn-add">Add (+)</button>
            <button id="btn-sub">Subtract (-)</button>
            <button id="btn-mul">Multiply (*)</button>
            <button id="btn-div">Divide (/)</button>
            <button id="btn-pow">Power (A^B)</button>
            <button id="btn-fac">Factorial (A!)</button>
        </div>

        <div class="result-box">
            <div class="result-label">Computed Result</div>
            <div id="result" class="result-val">0</div>
        </div>

        <div class="history" id="history">
            <div class="history-item">// Execution log</div>
        </div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
