name: Rove CI Battery

on:
  push:
    branches: [ main, release/** ]
  pull_request:
    branches: [ main ]

concurrency:
  group: rove-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Rove Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js (for js conformance)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust toolchain (for rust conformance)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Clang / GCC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang build-essential

      - name: Ensure Windows LLVM toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command clang++ -ErrorAction SilentlyContinue)) {
            choco install llvm --no-progress -y
          }
          if (Test-Path "C:\Program Files\LLVM\bin") {
            "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Execute Full Universal Test Suite
        run: |
          python -u tests/run_all_tests.py
