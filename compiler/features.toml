[metadata]
schema_version = 1
language_version = "5.0.2"
default_backend = "cpp"
capability_schema_version = 1
hir_schema_version = 1
bundle_abi_version = 1
lockfile_version = 1

[semantic_policies]
unsupported_feature = "rejected"
wasm_bounds_violation = "trapped"
native_memory_access = "unsafe-only"
host_platform_behavior = "implementation-defined"

[language]
stable_keywords = [
  "var", "let", "set", "const", "fn", "struct", "trait", "impl", "type", "enum", "extern",
  "if", "elif", "else", "for", "in", "loop", "while", "match", "try", "catch", "throw",
  "yield", "return", "break", "continue", "await", "defer", "guard", "unsafe", "spawn", "async",
  "use", "import", "from", "as", "test", "assert", "and", "or", "not", "true", "false", "null",
]
experimental_keywords = []
reserved_keywords = []
types = [
  "int", "i8", "i16", "i32", "i64", "u8", "u16", "u32", "u64", "float", "f32", "f64",
  "bool", "string", "char", "uintptr", "void", "any", "Array", "Iterator", "Option", "Result",
  "Channel", "Task",
]
builtins = [
  "Err", "Ok", "addr", "args", "channel", "contains", "delay_ms", "filter", "fold", "input",
  "is_number", "len", "map", "memdump", "peek", "print", "to_int", "to_string",
]
intrinsics = [
  "_nyx_base64_decode", "_nyx_base64_decode_result", "_nyx_base64_encode",
  "_nyx_bootstrap_file_exists", "_nyx_bootstrap_read_file", "_nyx_bootstrap_remove_file",
  "_nyx_bootstrap_write_file", "_nyx_channel_create", "_nyx_channel_recv", "_nyx_channel_send",
  "_nyx_destructure_check", "_nyx_fs_append_string", "_nyx_fs_append_string_result", "_nyx_fs_exists",
  "_nyx_fs_read_to_string", "_nyx_fs_read_to_string_result", "_nyx_fs_remove_file",
  "_nyx_fs_remove_file_result", "_nyx_fs_write_string", "_nyx_fs_write_string_result",
  "_nyx_hash_fnv1a_64_hex", "_nyx_json_escape", "_nyx_json_get_bool_full", "_nyx_json_get_int",
  "_nyx_json_get_int_full", "_nyx_json_get_int_result", "_nyx_json_get_string",
  "_nyx_json_get_string_full", "_nyx_json_get_string_result", "_nyx_json_has_key", "_nyx_math_abs",
  "_nyx_math_ceil", "_nyx_math_clamp", "_nyx_math_cos", "_nyx_math_floor", "_nyx_math_pow",
  "_nyx_math_round", "_nyx_math_sin", "_nyx_math_sqrt", "_nyx_math_tan", "_nyx_mutex_create",
  "_nyx_mutex_lock", "_nyx_mutex_unlock", "_nyx_net_tcp_close", "_nyx_net_tcp_close_result",
  "_nyx_net_tcp_connect", "_nyx_net_tcp_connect_result", "_nyx_net_tcp_recv",
  "_nyx_net_tcp_recv_result", "_nyx_net_tcp_send", "_nyx_net_tcp_send_result", "_nyx_path_basename",
  "_nyx_path_dirname", "_nyx_path_extname", "_nyx_path_is_abs", "_nyx_path_join",
  "_nyx_path_normalize", "_nyx_process_exec_cmd_result", "_nyx_process_exit",
  "_nyx_process_get_env_result", "_nyx_str_ends_with", "_nyx_str_find_result", "_nyx_str_replace",
  "_nyx_str_starts_with", "_nyx_str_to_lower", "_nyx_str_to_upper", "_nyx_str_trim",
  "_nyx_time_now_ms", "_nyx_time_now_us", "_nyx_time_sleep_ms", "_nyx_toolchain_compile_cpp",
  "_nyx_toolchain_last_error", "_nyx_utf8_from_codepoint",
]

