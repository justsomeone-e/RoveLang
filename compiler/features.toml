[[pipeline_stages]]
id = "lexer"
status = "stable"
authority = "src/core/lexer.py"
evidence = ["tests/bootstrap_lexer_test.py", "tests/language_surface_suite.py"]

[[pipeline_stages]]
id = "parser"
status = "stable"
authority = "src/core/parser.py"
evidence = ["tests/bootstrap_parser_test.py", "tests/bootstrap_parser_corpus_test.py"]

[[pipeline_stages]]
id = "module_graph"
status = "experimental"
authority = "src/core/identities.py"
evidence = ["tests/module_resolution_suite.py"]

[[pipeline_stages]]
id = "type_checker"
status = "stable"
authority = "src/core/type_checker.py"
evidence = ["tests/bootstrap_typechecker_test.py", "tests/negative_tests.py"]

[[pipeline_stages]]
id = "typed_hir"
status = "stable"
authority = "src/ir/model.py"
evidence = ["tests/ir_suite.py"]

[[pipeline_stages]]
id = "generic_instances"
status = "experimental"
authority = "src/ir/instances.py"
evidence = ["tests/ir_instances_suite.py"]

[[pipeline_stages]]
id = "static_dispatch"
status = "experimental"
authority = "src/ir/dispatch.py"
evidence = ["tests/mir_dispatch_suite.py"]

[[pipeline_stages]]
id = "hir_verifier"
status = "stable"
authority = "src/ir/verifier.py"
evidence = ["tests/ir_suite.py"]

[[pipeline_stages]]
id = "runtime"
status = "stable"
authority = "src/runtime"
evidence = ["tests/numeric_semantics_suite.py", "tests/cpp_e2e_suite.py", "tests/js_e2e_suite.py"]

[[pipeline_stages]]
id = "backends"
status = "stable"
authority = "src/core/backend_capabilities.py"
evidence = ["tests/capability_suite.py"]

[[pipeline_stages]]
id = "mir"
status = "experimental"
authority = "src/mir/model.py"
evidence = ["tests/mir_suite.py", "tests/mir_lowering_suite.py", "tests/mir_cleanup_suite.py", "tests/mir_memory_abi_suite.py", "tests/mir_coroutine_suite.py"]

[[pipeline_stages]]
id = "mir_legalization"
status = "experimental"
authority = "src/mir/legalization.py"
evidence = ["tests/mir_legalization_suite.py"]

[[effects]]
id = "control-transfer"
classification = "defined"
operations = ["return", "break", "continue", "throw", "yield"]

[[effects]]
id = "deferred-cleanup"
classification = "defined"
operations = ["defer"]

[[effects]]
id = "suspension-and-concurrency"
classification = "defined"
operations = ["async", "await", "spawn", "channel", "delay_ms"]

[[effects]]
id = "host-io"
classification = "implementation-defined"
operations = ["print", "input", "args"]

[[effects]]
id = "raw-memory"
classification = "unsafe-only"
operations = ["unsafe", "addr", "peek", "memdump"]

[feature_stage_profiles.core_language]
features = [
  "arrays", "async_tasks", "channels", "collection_combinators", "control_flow", "exceptions", "functions",
  "iterator_yield", "optionals", "pattern_match", "payload_enums", "result_propagation", "spawn", "strings",
  "structs", "unicode", "unsafe_memory",
]
parser = "implemented"
checker = "implemented"
hir = "implemented"
runtime = "implemented"
backend = "implemented"

[feature_stage_profiles.runtime_capability]
features = [
  "canonical_scalar_text", "encoding", "filesystem", "float64_ieee", "hash", "int64_wrap", "json_lite",
  "math", "native_ffi", "native_linking", "sockets", "threads", "time",
]
parser = "not-applicable"
checker = "not-applicable"
hir = "implemented"
runtime = "implemented"
backend = "implemented"

[feature_stage_profiles.react_surface]
features = ["components", "react19", "tsx"]
parser = "implemented"
checker = "implemented"
hir = "not-applicable"
runtime = "external"
backend = "implemented"

[feature_stage_profiles.wasm_contract]
features = [
  "array_mutation", "host_imports_v1", "numeric", "numeric_array_abi", "string_abi", "string_indexing",
  "wasi_args", "wasi_environ", "wasi_filesystem", "wasi_preview1", "wasm32", "web_dom",
]
parser = "not-applicable"
checker = "partial"
hir = "partial"
runtime = "implemented"
backend = "implemented"

[feature_stage_profiles.experimental_native]
features = ["array_iteration", "scalar_arrays", "scalar_c17", "scalar_llvm", "scalar_structs"]
parser = "implemented"
checker = "implemented"
hir = "implemented"
runtime = "partial"
backend = "experimental"

[feature_stage_profiles.hir_contract]
features = ["typed_hir_v1"]
parser = "not-applicable"
checker = "implemented"
hir = "implemented"
runtime = "not-applicable"
backend = "implemented"

[inventory]
type_forms = ["named", "generic", "optional", "pointer", "function"]
ast_nodes = [
  "ProgramNode", "TypeNode", "FunctionParam", "EnumMember", "VarDeclNode", "DestructureDeclNode", "AssignNode", "NumberNode",
  "StringNode", "BooleanNode", "NullNode", "IdentifierNode", "BinaryOpNode", "UnaryOpNode", "AwaitNode",
  "ResultPropagateNode", "FunctionDefNode", "LambdaNode", "StructDefNode", "TraitDefNode", "ImplBlockNode",
  "TypeAliasNode", "EnumDefNode", "UnsafeBlockNode", "SpawnNode", "TestBlockNode", "AssertNode",
  "MatchNode", "MatchExprNode", "TryCatchNode", "MemberAccessNode", "NullCoalesceNode",
  "ConditionalExprNode", "ArrayNode", "IndexAccessNode", "IfNode", "WhileNode", "ForNode", "ReturnNode",
  "ThrowNode", "YieldNode", "BreakNode", "ContinueNode", "DeferNode", "GuardNode", "FunctionCallNode",
  "ImportNode", "NativeIncludeNode", "NativeLinkNode", "NativeRawNode", "NativeUseNode", "ExternFnDeclNode",
]
hir_nodes = [
  "IRLiteral", "IRReference", "IRBinary", "IRUnary", "IRAwait", "IRResultPropagate", "IRCall",
  "IRMemberAccess", "IRIndexAccess", "IRArray", "IRNullCoalesce", "IRConditional", "IRMatchExpressionCase",
  "IRMatchExpression", "IRLambda", "IRVarDecl", "IRAssign", "IRExprStatement", "IRReturn", "IRThrow",
  "IRYield", "IRIf", "IRWhile", "IRFor", "IRBreak", "IRContinue", "IRDefer", "IRGuard", "IRUnsafeBlock",
  "IRSpawn", "IRAssert", "IRMatchCase", "IRMatch", "IRTryCatch", "IRTestBlock", "IRParameter", "IRFunction",
  "IRStruct", "IRTrait", "IRImpl", "IRTypeAlias", "IREnumMember", "IREnum", "IRExternFunction",
  "IRNativeDirective", "IRForeignImport", "IRModule",
]

[effect_model]
unknown_calls = "effectful"
pure_calls_require_explicit_classification = true
note = "M0 is conservative: calls and host interactions are effectful unless a later effect registry proves purity."

