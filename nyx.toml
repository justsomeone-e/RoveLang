# Nyx Package Manifest
[package]
name = "nyx"
version = "5.0.3"
edition = "2026"
authors = ["Nyx Authors"]
description = "Systems-oriented programming language with multi-target compilation"
license = "Apache-2.0"

[dependencies]
std = "5.0.3"

[build]
target = "cpp"
output_type = "exe"
opt_level = 2
