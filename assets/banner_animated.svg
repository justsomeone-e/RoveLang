<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="50%" stop-color="#0a1017"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>

    <!-- Silver-white metallic wordmark gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E1E6EB"/>
      <stop offset="100%" stop-color="#B8C2CC"/>
    </linearGradient>

    <!-- Cyan electric bevel gradient -->
    <linearGradient id="cyanFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0088FF"/>
    </linearGradient>

    <!-- Dark Shadow Bevel -->
    <linearGradient id="shadeFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B8896"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>

    <!-- Scanning Laser Line -->
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0)"/>
      <stop offset="50%" stop-color="rgba(0, 240, 255, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 240, 255, 0)"/>
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.06)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="masterGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(400px); opacity: 0; }
    }
    .scanner { animation: scanline 4.5s linear infinite; }

    @keyframes logoAura {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.3)); }
      50% { filter: drop-shadow(0 0 24px rgba(0, 240, 255, 0.75)); }
    }
    .metallic-logo { animation: logoAura 3.5s ease-in-out infinite; }

    @keyframes cardPulse {
      0%, 100% { stroke-opacity: 0.35; }
      50% { stroke-opacity: 0.85; }
    }
    .badge-card { animation: cardPulse 3s ease-in-out infinite; }
  </style>

  <!-- Base Cyber Card Frame -->
  <rect width="1000" height="400" rx="16" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="1000" height="400" rx="16" fill="url(#cyberGrid)"/>

  <!-- Outer Neon Border Glow -->
  <rect x="2" y="2" width="996" height="396" rx="15" fill="none" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1"/>

  <!-- Scanning Laser Line -->
  <line x1="0" y1="0" x2="1000" y2="0" stroke="url(#laserBeam)" stroke-width="2.5" class="scanner" filter="url(#glowFilter)"/>

  <!-- Decorative Circuit Paths & Nodes -->
  <path d="M 40 40 L 140 40 L 170 70 L 240 70" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1.5"/>
  <circle cx="240" cy="70" r="3.5" fill="#00f0ff" filter="url(#glowFilter)"/>

  <path d="M 960 40 L 860 40 L 830 70 L 760 70" fill="none" stroke="rgba(255, 0, 128, 0.25)" stroke-width="1.5"/>
  <circle cx="760" cy="70" r="3.5" fill="#ff0080" filter="url(#glowFilter)"/>

  <!-- Ambient Light Backdrops -->
  <circle cx="500" cy="140" r="160" fill="#00f0ff" opacity="0.08" filter="url(#masterGlow)"/>
  <circle cx="850" cy="180" r="120" fill="#7928ca" opacity="0.07" filter="url(#masterGlow)"/>

  <!-- ======================================================== -->
  <!-- CENTERED ROVE WORDMARK -->
  <!-- ======================================================== -->
  <g class="metallic-logo" font-family="'Arial Black', 'Inter', sans-serif" font-size="160" font-weight="900" letter-spacing="-8" text-anchor="middle">
    <text x="504" y="212" fill="url(#shadeFacet)" opacity="0.75">ROVE</text>
    <text x="500" y="206" fill="url(#silverGrad)" stroke="url(#cyanFacet)" stroke-width="1.2" paint-order="stroke fill">ROVE</text>
  </g>

  <!-- SUBTITLES AND COMPILER METADATA (Centered Under Logo) -->
  <g transform="translate(500, 240)" text-anchor="middle">
    <!-- Glowing Badge Pill -->
    <g transform="translate(-130, -16)">
      <rect width="260" height="26" rx="6" fill="rgba(0, 240, 255, 0.08)" stroke="#00f0ff" stroke-width="1.2" filter="url(#glowFilter)"/>
      <text x="130" y="17" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#00f0ff" letter-spacing="2">[ SYSTEMS COMPILER ]</text>
    </g>

    <text y="32" class="mono" font-size="14.5" font-weight="700" fill="#ffffff">Rove source preview · Self-Hosting Pipeline</text>
    <text y="54" class="mono" font-size="12" fill="#94a3b8">
      Multi-Target: <tspan fill="#00f0ff">C++20 Native</tspan> · <tspan fill="#ff0080">WebAssembly</tspan> · <tspan fill="#4ade80">Node.js</tspan> · <tspan fill="#f59e0b">Rust (beta)</tspan> · <tspan fill="#a855f7">Python</tspan>
    </text>
  </g>

  <!-- ======================================================== -->
  <!-- 4 BOTTOM STATUS BADGES TABLE ROW -->
  <!-- ======================================================== -->
  <g transform="translate(45, 320)">
    <!-- Badge 1: Self-Host Parity -->
    <rect x="0" y="0" width="210" height="52" rx="8" fill="#0c131d" stroke="#00f0ff" stroke-width="1.2" class="badge-card"/>
    <circle cx="22" cy="26" r="5" fill="#00f0ff" filter="url(#glowFilter)"/>
    <text x="40" y="22" class="mono" font-size="11" font-weight="700" fill="#00f0ff">SELF-HOSTING</text>
    <text x="40" y="39" class="mono" font-size="12" fill="#e2e8f0">Stage 1/2 parity tests</text>

    <!-- Badge 2: Assembly Target -->
    <rect x="233" y="0" width="210" height="52" rx="8" fill="#0c131d" stroke="#ff0080" stroke-width="1.2" class="badge-card"/>
    <circle cx="255" cy="26" r="5" fill="#ff0080" filter="url(#glowFilter)"/>
    <text x="273" y="22" class="mono" font-size="11" font-weight="700" fill="#ff0080">TARGET ENGINE</text>
    <text x="273" y="39" class="mono" font-size="12" fill="#e2e8f0">#target asm (x64)</text>

    <!-- Badge 3: Type Safety -->
    <rect x="466" y="0" width="210" height="52" rx="8" fill="#0c131d" stroke="#4ade80" stroke-width="1.2" class="badge-card"/>
    <circle cx="488" cy="26" r="5" fill="#4ade80" filter="url(#glowFilter)"/>
    <text x="506" y="22" class="mono" font-size="11" font-weight="700" fill="#4ade80">TYPECHECKER</text>
    <text x="506" y="39" class="mono" font-size="12" fill="#e2e8f0">Dual Rejection Pass</text>

    <!-- Badge 4: Tree Shaking -->
    <rect x="700" y="0" width="210" height="52" rx="8" fill="#0c131d" stroke="#7928ca" stroke-width="1.2" class="badge-card"/>
    <circle cx="722" cy="26" r="5" fill="#7928ca" filter="url(#glowFilter)"/>
    <text x="740" y="22" class="mono" font-size="11" font-weight="700" fill="#b794f4">CODE GENERATOR</text>
    <text x="740" y="39" class="mono" font-size="12" fill="#e2e8f0">Tree-Shaked Helpers</text>
  </g>
</svg>
