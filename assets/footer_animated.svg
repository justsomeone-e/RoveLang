<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="50%" stop-color="#0c121a"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>

    <!-- Silver-White Metallic Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E1E6EB"/>
      <stop offset="100%" stop-color="#B8C2CC"/>
    </linearGradient>

    <!-- Cyan Electric Bevel Gradient -->
    <linearGradient id="cyanFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0088FF"/>
    </linearGradient>

    <!-- Dark Shadow Bevel -->
    <linearGradient id="shadeFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B8896"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>

    <filter id="footGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="footGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', system-ui, sans-serif; }
    
    @keyframes footScan {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.85; }
    }
    .foot-pulse { animation: footScan 3s ease-in-out infinite; }
  </style>

  <!-- Container Frame -->
  <rect width="1000" height="160" rx="14" fill="url(#footBg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="1000" height="160" rx="14" fill="url(#footGrid)"/>

  <!-- Rove wordmark -->
  <g font-family="'Arial Black', 'Inter', sans-serif" font-size="86" font-weight="900" letter-spacing="-5" text-anchor="middle">
    <text x="169" y="110" fill="url(#shadeFacet)" opacity="0.75">ROVE</text>
    <text x="166" y="105" fill="url(#silverGrad)" stroke="url(#cyanFacet)" stroke-width="0.8" paint-order="stroke fill">ROVE</text>
  </g>

  <!-- Center Text (x=315 to x=760 with 445px clearance) -->
  <g transform="translate(315, 52)">
    <text x="0" y="16" class="sans" font-size="16.5" font-weight="700" fill="#ffffff">Rove Systems Programming Language</text>
    <text x="0" y="42" class="mono" font-size="12" fill="#94a3b8">Deterministic Multi-Target Systems Toolchain</text>
    <text x="0" y="64" class="mono" font-size="11" fill="#64748b">C++20 · x86_64 ASM · Node.js · Rust 2021 · Python 3</text>
  </g>

  <!-- Right Badge (x=790 to x=950) -->
  <g transform="translate(790, 52)">
    <rect width="160" height="56" rx="9" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5" class="foot-pulse" filter="url(#footGlow)"/>
    <text x="80" y="25" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#00f0ff">APACHE 2.0</text>
    <text x="80" y="43" text-anchor="middle" class="mono" font-size="10.5" fill="#e2e8f0">Free &amp; Open Source</text>
  </g>
</svg>
